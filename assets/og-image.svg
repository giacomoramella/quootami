<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFAF7"/>
      <stop offset="100%" stop-color="#F3F0E8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFD84D" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFD84D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- dot grid pattern -->
  <g fill="#0B1220" opacity="0.06">
    <circle cx="60" cy="60" r="1.5"/>
    <circle cx="120" cy="60" r="1.5"/>
    <circle cx="180" cy="60" r="1.5"/>
    <circle cx="240" cy="60" r="1.5"/>
    <circle cx="60" cy="120" r="1.5"/>
    <circle cx="120" cy="120" r="1.5"/>
    <circle cx="60" cy="570" r="1.5"/>
    <circle cx="120" cy="570" r="1.5"/>
    <circle cx="1080" cy="60" r="1.5"/>
    <circle cx="1140" cy="60" r="1.5"/>
    <circle cx="1080" cy="570" r="1.5"/>
    <circle cx="1140" cy="570" r="1.5"/>
  </g>

  <!-- main wordmark -->
  <g transform="translate(600, 280)">
    <text x="0" y="0"
          text-anchor="middle"
          font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
          font-weight="700"
          font-size="140"
          fill="#0B1220"
          letter-spacing="-4">quootami</text>
    <!-- yellow dot -->
    <circle cx="335" cy="-12" r="18" fill="#FFD84D"/>
  </g>

  <!-- highlight under "ami" -->
  <rect x="640" y="252" width="155" height="22" fill="#FFD84D" opacity="0.6" rx="2"/>

  <!-- tagline -->
  <text x="600" y="360"
        text-anchor="middle"
        font-family="Inter, sans-serif"
        font-weight="500"
        font-size="32"
        fill="#1F2937"
        letter-spacing="-0.5">Assicurazioni e previdenza</text>

  <!-- subtitle -->
  <text x="600" y="410"
        text-anchor="middle"
        font-family="Inter, sans-serif"
        font-weight="400"
        font-size="22"
        fill="#6B7280">Trova la copertura giusta e risparmia sulle tasse</text>

  <!-- brand badges -->
  <g transform="translate(600, 490)" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#6B7280">
    <rect x="-280" y="-22" width="180" height="42" rx="21" fill="white" stroke="#E5E5E0"/>
    <text x="-190" y="5" text-anchor="middle">RC Auto e Casa</text>

    <rect x="-90" y="-22" width="170" height="42" rx="21" fill="white" stroke="#E5E5E0"/>
    <text x="-5" y="5" text-anchor="middle">Salute e Vita</text>

    <rect x="90" y="-22" width="190" height="42" rx="21" fill="white" stroke="#E5E5E0"/>
    <text x="185" y="5" text-anchor="middle">Fondo pensione</text>
  </g>

  <!-- iscritto IVASS badge -->
  <g transform="translate(600, 590)" font-family="Inter, sans-serif" font-size="14" fill="#0B1220" opacity="0.55">
    <text x="0" y="0" text-anchor="middle">Broker iscritto IVASS · Confronto multi-compagnia</text>
  </g>
</svg>
