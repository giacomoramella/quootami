<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<title>Sito in manutenzione</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --yellow: #FFD84D; --text: #0B1220; --bg: #FAFAF7; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 2rem 5vw;
  }
  h1 {
    font-family: 'Inter', sans-serif; font-weight: 700;
    font-size: clamp(2rem, 6vw, 4rem); letter-spacing: -.02em; line-height: 1.1;
    text-align: center;
  }
  h1 .accent { position: relative; display: inline-block; z-index: 1; }
  h1 .accent::before {
    content: ''; position: absolute; left: -4px; right: -4px;
    top: 55%; bottom: 6%; background: var(--yellow); z-index: -1;
  }
</style>
</head>
<body>
  <h1>Sito in <span class="accent">manutenzione.</span></h1>
</body>
</html>
